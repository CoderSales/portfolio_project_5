name: Dependency and authentication checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10.21'
      - name: Install dependencies without cached builds or custom constraints
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip --isolated install --no-cache-dir -r requirements.txt
          python -m pip check
      - name: Test authentication with a temporary database and local email
        run: python manage.py test profiles --settings=portfolio_project_5.test_settings
